<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍚 值星公差小幫手</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <h1>🍚 值星公差小幫手</h1>
    <p class="subtitle">261 梯 × 263 梯 · 公平自動排勤務</p>
  </header>

  <nav class="tab-bar" id="tab-bar">
    <button class="tab-btn active" data-tab="schedule">📅 產生班表</button>
    <button class="tab-btn" data-tab="textschedule">📝 文字班表</button>
    <button class="tab-btn" data-tab="roster">👥 名冊</button>
    <button class="tab-btn" data-tab="dutyconfig">⚙️ 勤務設定</button>
    <button class="tab-btn" data-tab="shopping">🛒 採買紀錄</button>
    <button class="tab-btn" data-tab="dashboard">📊 公平性總覽</button>
    <button class="tab-btn" data-tab="cloud">☁️ 雲端同步</button>
  </nav>

  <main class="tab-content">
    <section id="tab-schedule" class="tab-panel active"></section>
    <section id="tab-textschedule" class="tab-panel"></section>
    <section id="tab-roster" class="tab-panel"></section>
    <section id="tab-dutyconfig" class="tab-panel"></section>
    <section id="tab-shopping" class="tab-panel"></section>
    <section id="tab-dashboard" class="tab-panel"></section>
    <section id="tab-cloud" class="tab-panel"></section>
  </main>

  <footer class="app-footer">
    <span>資料儲存在本機瀏覽器（localStorage）</span>
    <button id="export-btn" type="button" class="ghost-btn">匯出備份</button>
    <label class="ghost-btn file-label">
      匯入備份
      <input type="file" id="import-input" accept="application/json" hidden>
    </label>
  </footer>
</div>

<script src="js/state.js"></script>
<script src="js/washSchedule.js"></script>
<script src="js/otherDuties.js"></script>
<script src="js/cleanupGroups.js"></script>
<script src="js/laundry.js"></script>
<script src="js/dutySizeConfig.js"></script>
<script src="js/dutyView.js"></script>
<script src="js/scheduleEngine.js"></script>
<script src="js/roster.js"></script>
<script src="js/shopping.js"></script>
<script src="js/cloudSync.js"></script>
<script src="js/ui-roster.js"></script>
<script src="js/ui-dutyconfig.js"></script>
<script src="js/ui-schedule.js"></script>
<script src="js/ui-textschedule.js"></script>
<script src="js/ui-shopping.js"></script>
<script src="js/ui-dashboard.js"></script>
<script src="js/ui-cloud.js"></script>
<script src="js/app.js"></script>
</body>
</html>
